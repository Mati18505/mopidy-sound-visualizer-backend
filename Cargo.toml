[package]
name = "mopidy-sound-visualizer"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
futures-util = "0.3.32"
gstreamer = "0.24.5"
gstreamer-app = "0.24.5"
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = "0.7.18"
tower-http = { version = "0.6.8", features = ["cors"] }
