[package]
name = "mopidy-sound-visualizer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
build-time = "0.1.3"
futures-util = "0.3.32"
gstreamer = "0.25.2"
gstreamer-app = "0.25.2"
lerp = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sys-info = "0.9.1"
tokio = { version = "1.52.1", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = "0.7.18"
tower-http = { version = "0.6.8", features = ["cors"] }
tracing = { version = "0.1.44", features = ["log", "valuable"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
valuable = { version = "0.1.1", features = ["derive"] }
